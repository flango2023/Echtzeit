name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the workflow only needs to read the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
      # The encryption tests skip without sqlcipher3, so prove it is installed, then run every
      # ledger test again on an encrypted database.
      - run: python -c "import sqlcipher3"
      - run: pytest
        env:
          ECHTZEIT_TEST_ENCRYPTED: "1"

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]" bandit pip-audit
      - run: bandit -q -r src
      - run: pip-audit --skip-editable
